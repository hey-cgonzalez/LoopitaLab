name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Todas las acciones van fijadas por SHA de commit (seguridad, B6), con la versión en un comentario. Para actualizar:
#   git ls-remote https://github.com/<dueño>/<repo> refs/tags/<tag> 'refs/tags/<tag>^{}'
# (si el tag es anotado, el SHA del commit es el de la línea con ^{}).
#
# Imagen del runner fijada (ubuntu-26.04, la misma a la que apunta ubuntu-latest desde noviembre de 2026,
# actions/runner-images#14748): así un cambio de imagen por parte de GitHub no altera la CI sin que lo decidamos.
# Los jobs E2E no instalan nada por apt: la imagen ya trae todas las bibliotecas que Chromium necesita (ver el job e2e).

jobs:
  nucleo:
    name: Núcleo (motor y lanas)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Pruebas de pattern-core
        working-directory: packages/pattern-core
        run: node --test "test/**/*.test.ts"
      - name: Pruebas de yarn-catalog
        working-directory: packages/yarn-catalog
        run: node --test "test/**/*.test.ts"
      - name: Pruebas de ai-router
        working-directory: packages/ai-router
        run: node --test "test/**/*.test.ts"
      # stitch-render, pattern-render y follow importan pattern-core (y yarn-catalog) por nombre de
      # paquete: hace falta enlazar el workspace. El filtro instala solo ese paquete y sus dependencias
      # dentro del monorepo (sin dependencias de terceros, ADR 0002).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Enlaces del workspace para stitch-render, pattern-render y follow
        run: pnpm install --frozen-lockfile --filter "@loopitalab/stitch-render..." --filter "@loopitalab/pattern-render..." --filter "@loopitalab/follow..."
      - name: Pruebas de stitch-render (incluye la guardia de rendimiento CA-P5)
        working-directory: packages/stitch-render
        run: node --test "test/**/*.test.ts"
      - name: Pruebas de pattern-render
        working-directory: packages/pattern-render
        run: node --test "test/**/*.test.ts"
      # follow (secuenciador del modo tejiendo) importa pattern-core por nombre de paquete.
      - name: Pruebas de follow
        working-directory: packages/follow
        run: node --test "test/**/*.test.ts"

  # Cuando existan, agregar aquí (mismo patrón que arriba; hoy no hay `pnpm -r test`, cada paquete corre `node --test`):
  #   - packages/glossary: `node --test "test/**/*.test.ts"` (sin dependencias de terceros, no necesita enlaces).
  #   - packages/viewer-3d: `node --test "test/**/*.test.ts"` para perfil y malla puros (ADR 0010); si importa pattern-core
  #     por nombre de paquete, agregar `--filter "@loopitalab/viewer-3d..."` al `pnpm install` de los enlaces del workspace.
  #     El backend three/r3f se prueba en el job "web" (Vitest) y en el job e2e.
  base-de-datos:
    name: Migraciones y RLS
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loopita
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loopita
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Aplicar stubs de Supabase y migraciones
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/checks/00_stubs_supabase.sql
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Verificar aislamiento entre usuarias
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/checks/10_rls_check.sql

  web:
    name: Web (tipos y build)
    runs-on: ubuntu-26.04
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos de los paquetes
        run: pnpm exec tsc -p tsconfig.json
      - name: Tipos de la web
        run: pnpm --filter @loopitalab/web typecheck
      - name: Tipos de las pruebas de la web
        run: pnpm --filter @loopitalab/web typecheck:test
      - name: Tipos de las pruebas E2E
        run: pnpm --filter @loopitalab/web typecheck:e2e
      - name: Pruebas de la web (Vitest)
        run: pnpm --filter @loopitalab/web test
      - name: Build de la web
        run: pnpm --filter @loopitalab/web build

  e2e:
    name: E2E (estudio)
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Los runners de GitHub (4 vCPU compartidas, sin GPU) son más lentos que el equipo de referencia: la prueba de
      # latencia usa 160 ms como guardia de regresiones (peor p95 medido en la CI, 102 ms del círculo de 40.000
      # puntos al cambiar repeticiones, por 1,5); el umbral de CA-P1 y CA-P3 (100 ms) se exige en local y en
      # el equipo de referencia (CA-P6). Ver apps/web/e2e/README.md.
      E2E_LATENCY_BUDGET_MS: "160"
      # Presupuesto de latencia del visor 3D con WebGL por software (SwiftShader, sin GPU), en ms. Lo leerán las
      # pruebas del visor (fase 4, T3b y siguientes), igual que E2E_LATENCY_BUDGET_MS. Valor provisional, sin medir:
      # se calibra con la primera corrida real del visor y es una guardia de regresiones; el umbral de la regla de
      # oro 7 (100 ms) se exige en el equipo de referencia. Ver apps/web/e2e/README.md.
      E2E_VIEWER_BUDGET_MS: "400"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versión de Playwright
        id: playwright
        working-directory: apps/web
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Caché de los navegadores de Playwright
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Chromium (solo si la caché no lo tenía)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        # Sin `--with-deps`: ese modo corre apt-get contra los espejos de Ubuntu en cada corrida, y una caída de esos
        # espejos (2026-11-11, actions/runner-images#15296) tumbó la CI aunque Chromium ya estaba en caché. La imagen
        # ubuntu-26.04 trae todas las bibliotecas que Chromium necesita (apt solo agregaba fuentes CJK y X11 que las
        # pruebas no usan). Si alguna vez faltara una, Playwright lo dice al lanzar el navegador ("Host system is missing
        # dependencies") y bastaría con volver a agregar `pnpm exec playwright install-deps chromium`.
        # Tres intentos con espera por si el CDN de Playwright falla de forma transitoria.
        run: |
          for i in 1 2 3; do
            pnpm exec playwright install chromium && exit 0
            echo "::warning::Descarga de Chromium fallida (intento $i de 3); reintento en 20 s"
            sleep 20
          done
          exit 1
      - name: Pruebas E2E del estudio (/dev/estudio) y de WebGL por software (/dev/webgl)
        # El proyecto "webgl" lanza Chromium con los flags de SwiftShader (playwright.config.ts, `webglLaunch`) y en la CI
        # exige que el renderer sea SwiftShader. El servidor (next build + next start con LOOPITA_DEV_PAGES=1 y variables de ejemplo) lo levanta playwright.config.ts.
        run: pnpm --filter @loopitalab/web e2e
      - name: Reporte y trazas de Playwright
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore

  e2e-sesion:
    name: E2E con sesión (Supabase local)
    runs-on: ubuntu-26.04
    # Medido en local (Mac): ~4 min con las imágenes ya descargadas. En GitHub se estima 10 a 14 min: descargar las
    # imágenes de Supabase (~2 a 4 min), supabase start (~1 min), install, Chromium, next build (~2 min) y las pruebas.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_SUPABASE: "1"
      # Misma guardia de latencia que el job "E2E (estudio)" (row-to-paint de "Tejiendo", CA3-P3).
      E2E_LATENCY_BUDGET_MS: "160"
      # Ajustes de Auth SOLO para esta Supabase local (la CLI lee SUPABASE_<SECCIÓN>_<CLAVE> por encima de
      # config.toml): sitio y vuelta de los correos en el puerto de las E2E, y Google apagado (no hay cliente OAuth
      # de prueba). config.toml no cambia: es la configuración del proyecto real.
      SUPABASE_AUTH_SITE_URL: http://localhost:3200
      SUPABASE_AUTH_ADDITIONAL_REDIRECT_URLS: http://localhost:3200/auth/callback
      SUPABASE_AUTH_EXTERNAL_GOOGLE_ENABLED: "false"
      SUPABASE_CLI: supabase
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          # La misma versión fija que playwright.config.ts (SUPABASE_CLI_VERSION) y e2e/README.md.
          version: 2.122.1
      - name: Supabase local (todas las migraciones de supabase/migrations)
        # Solo los servicios que usan las pruebas: base, Auth, API (PostgREST), Storage, Kong y el correo (Mailpit).
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,postgres-meta,supavisor,realtime
      - name: URL y claves de desarrollo de la Supabase local
        # Son las claves por defecto de la CLI (públicas, solo valen contra 127.0.0.1). Nunca las del proyecto real.
        run: |
          supabase status -o json 2>/dev/null > "$RUNNER_TEMP/supabase.json"
          {
            echo "E2E_SUPABASE_URL=$(jq -r .API_URL "$RUNNER_TEMP/supabase.json")"
            echo "E2E_SUPABASE_PUBLISHABLE_KEY=$(jq -r .PUBLISHABLE_KEY "$RUNNER_TEMP/supabase.json")"
            echo "E2E_SUPABASE_SECRET_KEY=$(jq -r .SECRET_KEY "$RUNNER_TEMP/supabase.json")"
            echo "E2E_MAILPIT_URL=$(jq -r '.MAILPIT_URL // .INBUCKET_URL' "$RUNNER_TEMP/supabase.json")"
            echo "E2E_DB_URL=$(jq -r .DB_URL "$RUNNER_TEMP/supabase.json")"
          } >> "$GITHUB_ENV"
      - name: Verificar aislamiento entre usuarias (RLS sobre la Supabase local, sin stubs)
        run: psql "$E2E_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/checks/10_rls_check.sql
      - name: Versión de Playwright
        id: playwright
        working-directory: apps/web
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Caché de los navegadores de Playwright
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Chromium (solo si la caché no lo tenía)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        # Sin `--with-deps` ni apt, por lo mismo que en el job e2e.
        run: |
          for i in 1 2 3; do
            pnpm exec playwright install chromium && exit 0
            echo "::warning::Descarga de Chromium fallida (intento $i de 3); reintento en 20 s"
            sleep 20
          done
          exit 1
      - name: Pruebas E2E con sesión
        # playwright.config.ts levanta next build + next start en localhost:3200 apuntando a la Supabase local; el proyecto
        # sesion-preparar crea las cuentas y sesion-limpiar las borra.
        run: pnpm --filter @loopitalab/web e2e --project=sesion
      - name: Reporte y trazas de Playwright
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-sesion-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Detener Supabase local
        if: always()
        run: supabase stop --no-backup
