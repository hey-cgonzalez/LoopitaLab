# Configuración para la CLI de Supabase (desarrollo local y `supabase link` / `db push` / `config push`).
# Mantener igual en el panel del proyecto remoto.
project_id = "loopitalab"

[auth]
site_url = "http://localhost:3000"
# Lista exacta, sin comodines: los enlaces de los correos solo pueden volver aquí.
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
# Confirmar el correo evita cuentas falsas y que el registro revele qué correos existen.
enable_confirmations = true
# Cambiar la contraseña con una sesión antigua exige volver a autenticarse.
secure_password_change = true

# CAPTCHA en registro, ingreso y recuperación (M5, segunda capa). Desactivado hasta abrir el registro.
# Para activarlo:
#   1. Crear un widget de Cloudflare Turnstile para el dominio del sitio.
#   2. Guardar la clave secreta como SUPABASE_AUTH_CAPTCHA_SECRET (en local, en supabase/.env;
#      en el proyecto remoto, en Authentication > Attack Protection > CAPTCHA del panel).
#   3. Publicar la clave de sitio en la web (NEXT_PUBLIC_TURNSTILE_SITE_KEY) y enviar `captchaToken`
#      en signUp, signInWithPassword y resetPasswordForEmail.
#   4. Cambiar enabled a true aquí y en el panel al mismo tiempo que se despliega el front;
#      si se activa antes, todos los formularios de acceso fallan con captcha_failed.
[auth.captcha]
enabled = false
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"
